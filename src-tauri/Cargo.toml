[package]
name = "flopsic"
version = "0.1.0"
description = "Local-first Windows music player"
authors = ["Flopsic"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lofty = "0.25"
walkdir = "2"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
